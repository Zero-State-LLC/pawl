# Fast local checks. CI is the authority (see docs/RECOMMENDATION.md).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-em-dash
        name: no em dashes
        entry: "\u2014"
        language: pygrep
        types: [text]
      - id: pawl-check
        name: pawl check
        entry: python -m pawl check
        language: system
        pass_filenames: false
        stages: [pre-push]
