# Pawl gates its own repository (dogfood). Same as
# integrations/github/pawl.yml, except it installs Pawl from this checkout.
# Make the "pawl" job a required status check on main.
#
# Unlike the shipped template, this runs on the org self-hosted Macs
# ([self-hosted, macOS]) because GitHub-hosted jobs are refused while org
# Actions billing is blocked, and gets Python from uv instead of
# actions/setup-python (which needs sudo on self-hosted macOS). See ci.yml.
name: pawl

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pawl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pawl:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # only for the report comment
    env:
      BASE_REF: ${{ github.base_ref }}
      EVENT: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Python 3.12 venv (uv-managed, job-local)
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        run: |
          uv venv --managed-python --python 3.12 --seed "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install
        run: python -VV && python -m pip install -e ".[dev]"
      - name: Pawl check (gate definition from the base branch)
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            pawl check --ci --trusted-ref "origin/$BASE_REF"
          else
            pawl check --ci
          fi
      - name: Pawl guard (tamper detection and test replay)
        if: always() && github.event_name == 'pull_request'
        run: pawl guard --ci --replay --base "origin/$BASE_REF"
      - name: Post the report on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true # fork PRs get a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pawl report --format md > pawl-report.md
          gh pr comment "$PR_NUMBER" --body-file pawl-report.md --edit-last \
            || gh pr comment "$PR_NUMBER" --body-file pawl-report.md
