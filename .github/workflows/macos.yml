# Optional macOS run on the org self-hosted Mac. Manual only (workflow_dispatch),
# not a required check. Required CI runs on ubuntu-latest (ci.yml, pawl.yml).
name: macos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-macos:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Python 3.13 venv (uv-managed, job-local)
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        run: |
          uv venv --managed-python --python 3.13 --seed "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -VV && python -m pip install -e ".[dev]"
      - run: python -m pytest -q
