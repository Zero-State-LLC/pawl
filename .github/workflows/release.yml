# Publish pawl-gate to PyPI with Trusted Publishing (OIDC, no API token) and
# PEP 740 publish attestations. Actions are pinned by commit SHA.
#
# Trigger: pushing a tag vX.Y.Z whose version equals pyproject.toml and whose
# commit is on main. The publish job uses the "pypi" environment, so the
# environment's deployment rules decide whether it runs. Repository and PyPI
# settings it relies on: docs in the 0.2.0 settings steps (PyPI trusted
# publisher for this file and environment, "pypi" environment limited to v*
# tags, tag ruleset restricting who can create v* tags).
#
# Runs on GitHub-hosted ubuntu-latest. Signs with astral-sh/attest-action and
# uploads with `uv publish --trusted-publishing always`, which sends the
# attestation files next to each distribution. The v0.3.0 run (38087063957)
# and the v0.4.0 run (38091969331) both succeeded.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Tag matches both version declarations and is on main
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run --no-project --managed-python --python 3.13 python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          runtime="$(uv run --no-project --managed-python --python 3.13 python -c \
            'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/pawl/__init__.py").read())[1])')"
          if [ "$TAG" != "v$version" ] || [ "$TAG" != "v$runtime" ]; then
            echo "::error::tag $TAG, pyproject.toml $version, and pawl.__version__ $runtime must agree"
            exit 1
          fi
          # fetch-depth: 0 already fetched origin/main; there are no credentials
          # for another fetch (persist-credentials: false).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - name: Build sdist and wheel
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        run: |
          rm -rf "$RUNNER_TEMP/dist"
          uv build --no-sources --managed-python --python 3.13 --out-dir "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
      - name: twine check
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        run: uvx --managed-python --python 3.13 twine==7.0.0 check --strict "$RUNNER_TEMP"/dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pawl-gate/
    permissions:
      contents: read
      id-token: write # Trusted Publishing and Sigstore signing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Generate PEP 740 publish attestations (Sigstore, workflow identity)
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        with:
          paths: ${{ runner.temp }}/dist/*
      - name: Publish to PyPI (Trusted Publishing)
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        run: |
          ls -l "$RUNNER_TEMP/dist"
          uv publish --trusted-publishing always "$RUNNER_TEMP/dist/*"
