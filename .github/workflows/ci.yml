# Lint, types, and tests. Actions are pinned by commit SHA.
#
# Runs on GitHub-hosted ubuntu-latest. macOS is optional: run the manual
# macos.yml workflow on the org self-hosted Mac. Python comes from uv
# (python-build-standalone) in a throwaway venv under RUNNER_TEMP.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Python 3.13 venv (uv-managed, job-local)
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
        run: |
          uv venv --managed-python --python 3.13 --seed "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -VV && python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: No em dashes
        # printf octal keeps this portable to macOS /bin/bash 3.2 and BSD grep.
        run: "! LC_ALL=C grep -rn --exclude-dir=.git \"$(printf '\\342\\200\\224')\" ."
      - name: Actions pinned and allow-listed
        run: python scripts/check_actions.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Python ${{ matrix.python-version }} venv (uv-managed, job-local)
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.tool_cache }}/uv-python
          PY: ${{ matrix.python-version }}
        run: |
          uv venv --managed-python --python "$PY" --seed "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -VV && python -m pip install -e ".[dev]"
      - name: Runtime receipt (tests/test_runtimes.py skips any that are missing)
        run: |
          for t in go cargo node; do
            if command -v "$t" >/dev/null 2>&1; then echo "$t: $(command -v "$t")"; else echo "$t: not installed (its runtime test will skip)"; fi
          done
      - name: Tests with coverage
        run: python -m pytest --cov=pawl --cov-report=term
