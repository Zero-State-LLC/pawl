# Pawl gate for the demo project. Changes here need human approval.
[pawl]
baseline = "pawl.baseline.json"
debt_log = "PAWL_DEBT.md"
lock_in_ci = true

[[suite]]
name = "tests"
adapter = "pytest"
command = ["python", "-m", "pytest", "tests", "-q"]
identity = "ids"
check_orders = 2

[[suite]]
name = "holdout"
adapter = "pytest"
command = ["python", "-m", "pytest", "holdout", "-q"]
ci_only = true

# Open TODO/FIXME comments in calc may not grow by more than one. A crash of the
# linter is an error, not 0 findings.
[[metric]]
name = "todo_comments"
command = ["python", "tools/todo_lint.py"]
direction = "down"
extract = "count-regex:^\\S+:\\d+:\\d+: T001 "
tolerance = 1

[preflight]
python = "python"
imports = [{ module = "calc", expect_under = "." }]
