[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pawl-gate"
version = "0.1.0"
description = "Ratchet gate for automated coding work. Code can only move forward."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Zero-State LLC" }]
keywords = ["ratchet", "ci", "testing", "ai-agents", "reward-hacking", "quality-gate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
pawl = "pawl.cli:main"

[project.urls]
Source = "https://github.com/Zero-State-LLC/pawl"
Issues = "https://github.com/Zero-State-LLC/pawl/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pawl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: runs real subprocess suites"]

[tool.coverage.run]
source = ["pawl"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks"]
extend-exclude = ["examples/*/scenarios", "benchmarks/work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = [
  "S603", "S607",   # subprocess with argv lists is the core job of this tool
  "S404",
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
  "S101",           # assert is fine in tests and internal invariants
  "RUF001",
  "PLC0415",        # lazy imports keep hook start-up fast
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501", "PLW0108"]
"benchmarks/*" = ["S", "T201", "E501", "PLW2901"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/pawl"]
